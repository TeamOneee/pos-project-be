groups:
  - name: pos-alerts
    rules:
      - alert: HighErrorRate
        expr: rate(http_requests_total{status_code=~"5.."}[5m]) / rate(http_requests_total[5m]) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 'Error rate > 5% for 5 minutes'
          description: 'Current error rate: {{ $value | humanizePercentage }}'

      - alert: HighLatency
        expr: histogram_quantile(0.99, rate(http_request_duration_seconds_bucket[5m])) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'P99 latency > 2s for 5 minutes'
          description: 'Current P99: {{ $value }}s'

      - alert: ServiceDown
        expr: up{job="nestjs-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: 'NestJS API is unreachable'

      - alert: HighJobBacklog
        expr: pos_ai_jobs_total{state="PENDING"} > 50
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'AI job backlog > 50 pending jobs'
          description: 'Current pending jobs: {{ $value }}'
